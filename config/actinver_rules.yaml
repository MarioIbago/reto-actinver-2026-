  portfolio_valuation:
    intraday: continuously_during_market_hours
    end_of_day: reconciled_after_session_close
    dividends_and_subscriptions_reproduced: false
    splits_reverse_splits_and_name_changes_reproduced: true
    corporate_action_details: per_bmv_rules_and_actinver_notices
  contest_rules:
    minimum_share_criterion_applies_for_award_eligibility: true
    concentration_criterion_applies_for_award_eligibility: true
    final_rank_one_objective_is_project_objective_not_official_award_metric: true
ambiguities:
  - ambiguity_id: min_assets_vs_shares
    description: "The participant guide says at least five investment instruments; the rules page says at least five distinct shares/actions."
    resolution_policy: "Represent both constraints; award eligibility requires satisfying the stricter five-distinct-share interpretation until Actinver clarifies."
  - ambiguity_id: concentration_basis
    description: "The guide states no more than 50% of the portfolio in one instrument; the rules page prohibits purchases in one share above 50% of portfolio value during the period."
    resolution_policy: "Represent both current instrument weight and cumulative single-share purchases. Do not certify award eligibility from current holdings alone."
  - ambiguity_id: fibers_eligibility
    description: "The 2026 participant-guide annex lists four FIBRAs. The rules body describes eligible values as shares, ETFs and investment funds without naming FIBRAs."
    resolution_policy: "Preserve the four guide-listed FIBRAs with a source-conflict flag; do not treat guide inclusion as unambiguous rulebook eligibility."
  - ambiguity_id: title_and_enrollment_dates
    description: "The rules page title says 2025 and its body says 2026; the guide gives October 2 as enrollment close, while rules and homepage FAQ give October 4."
    resolution_policy: "Use explicit 2026 competition dates from the rules and homepage; preserve the page-title/date discrepancies in provenance."
  - ambiguity_id: platform_symbol_and_series
    description: "The guide warns that its issuer labels may not be the exact simulator-search ticker/series; no authenticated platform export was available for this verification."
    resolution_policy: "Store guide symbols as source labels and leave platform_symbol and series unresolved until a direct platform list is supplied or reviewed."
  - ambiguity_id: pending_order_expiry_day
    description: "The rules say unfilled orders expire after one day but do not say whether this means a calendar day or BMV business day."
    resolution_policy: "Store the one-day duration without assigning a calendar/business-day interpretation."
