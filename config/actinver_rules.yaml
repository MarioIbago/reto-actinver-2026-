rules:
  starting_capital_actipesos: 1000000
  currency: MXN
  award_metric: absolute_portfolio_gain
  short_selling_allowed: false
  allowed_order_sides: [buy, sell]
  allowed_order_types: [market, limit]
  order_receipt:
    availability: 24x7_except_platform_maintenance
    timezone: America/Mexico_City
    after_market_date_value: next_bmv_business_day
  market_execution_windows:
    weekdays_only: true
    exclude_bmv_holidays: true
    holiday_calendar_source: null
    windows:
      - start_date: "2026-10-05"
        end_date: "2026-11-02"
        open: "07:30:00"
        close: "14:00:00"
      - start_date: "2026-11-03"
        end_date: null
        open: "08:30:00"
        close: "15:00:00"
    source_timezone: America/Mexico_City
  order_execution:
    market: next_bmv_trade_after_order_registration
    limit: subsequent_bmv_trade_at_requested_price
    fill_guaranteed: false
    pending_order_expiration_days: 1
    pending_order_expiration_unit: day
    pending_order_expiration_day_basis: unspecified_by_source
    pending_orders_may_be_cancelled: true
    filled_orders_may_be_cancelled: false
    order_modification_allowed: false
  costs:
    commission_rate: 0.001
    iva_rate_on_commission: 0.16
    effective_rate: 0.00116
    charged_on: [buy, sell]
    rounding_rule: null
  portfolio_constraints:
    minimum_distinct_guide_instruments: 5
    minimum_distinct_traded_shares: 5
    maximum_single_instrument_weight: 0.5
    maximum_single_share_purchase_to_portfolio_value: 0.5
    concentration_comparison: strictly_greater_than_limit_is_violation
    concentration_status: ambiguous_between_current_weight_and_period_purchases
    minimum_count_status: ambiguous_between_guide_instruments_and_regulation_shares
  buying_power:
    purchases_must_not_exceed_available_buying_power: true
    available_buying_power_includes: [remaining_cash, completed_sale_proceeds]
    subtracts_reserved_pending_buy_orders: true
  selling:
    must_not_exceed_currently_held_quantity: true
    short_selling_allowed: false
  instrument_eligibility:
    source_universe_snapshot: data/metadata/actinver_universe_2026_v1.json
